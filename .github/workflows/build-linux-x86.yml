name: Build YaPB ZP43 Linux x86

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/build-linux-x86.yml"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake ninja-build python3 curl xz-utils file binutils

      - name: Install Zig 0.13
        run: |
          curl -L https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o /tmp/zig.tar.xz
          tar -xf /tmp/zig.tar.xz -C /tmp
          echo "/tmp/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"

      - name: Checkout YaPB dev with submodules
        run: |
          git clone --depth 1 --branch master --recurse-submodules https://github.com/yapb/yapb.git yapb
          cd yapb
          git submodule update --init --recursive

      - name: Apply Zombie Plague 4.3 changes
        shell: python
        run: |
          from pathlib import Path

          cvars = Path("yapb/inc/cvars.h")
          s = cvars.read_text()
          marker = 'inline ConVar cv_ignore_objectives ("ignore_objectives", "0", "Allows or disallows bots to do map objectives, i.e. plant/defuse bombs, and save hostages.");'
          zp = """inline ConVar cv_zp_shelter_time ("zp_shelter_time", "18", "Zombie Plague: seconds after round start that human bots prioritize camp/shelter nodes instead of roaming.", true, 0.0f, 90.0f);
          inline ConVar cv_zp_population_schedule ("zp_population_schedule", "1", "Zombie Plague: enables time-of-day bot population management.");
          inline ConVar cv_zp_day_start ("zp_day_start", "8", "Zombie Plague: hour when daytime bot quota starts.", true, 0.0f, 23.0f);
          inline ConVar cv_zp_evening_start ("zp_evening_start", "18", "Zombie Plague: hour when evening bot quota starts.", true, 0.0f, 23.0f);
          inline ConVar cv_zp_night_start ("zp_night_start", "0", "Zombie Plague: hour when night bot quota starts.", true, 0.0f, 23.0f);
          inline ConVar cv_zp_day_bots ("zp_day_bots", "4", "Zombie Plague: target bot count during daytime.", true, 0.0f, static_cast<float> (kGameMaxPlayers));
          inline ConVar cv_zp_evening_bots ("zp_evening_bots", "8", "Zombie Plague: target bot count during evening.", true, 0.0f, static_cast<float> (kGameMaxPlayers));
          inline ConVar cv_zp_night_bots ("zp_night_bots", "4", "Zombie Plague: target bot count during night.", true, 0.0f, static_cast<float> (kGameMaxPlayers));"""
          if "cv_zp_shelter_time" not in s:
              s = s.replace(marker, marker + "\n" + zp)
          cvars.write_text(s)

          manager = Path("yapb/src/manager.cpp")
          s = manager.read_text()
          marker = "  int desired_bot_count = cv_quota.As<int> ();"
          zp = r'''
          
            // Zombie Plague population schedule. Autovacate below still makes room for real players.
            if (game.Is (GameFlags::ZombieMod) && cv_zp_population_schedule) {
              time_t ticks = time (&ticks);
              tm local {};
              ystl::plat.loctime (&local, &ticks);
          
              const int hour = local.tm_hour;
              const int day_start = cv_zp_day_start.As<int> ();
              const int evening_start = cv_zp_evening_start.As<int> ();
              const int night_start = cv_zp_night_start.As<int> ();
          
              if (day_start <= evening_start) {
                if (hour >= day_start && hour < evening_start) {
                  desired_bot_count = cv_zp_day_bots.As<int> ();
                }
                else if (hour >= evening_start) {
                  desired_bot_count = cv_zp_evening_bots.As<int> ();
                }
                else {
                  desired_bot_count = cv_zp_night_bots.As<int> ();
                }
              }
              else {
                desired_bot_count = (hour >= day_start || hour < evening_start)
                  ? cv_zp_day_bots.As<int> () : cv_zp_evening_bots.As<int> ();
              }
          
              (void) night_start;
            }'''
          if "Zombie Plague population schedule" not in s:
              s = s.replace(marker, marker + zp, 1)
          manager.write_text(s)

          nav = Path("yapb/src/navigate.cpp")
          s = nav.read_text()
          marker = "int Bot::FindBestGoal () {"
          zp = r'''
            // ZP humans first look for analyzer-marked camp/shelter nodes before infection settles.
            if (game.Is (GameFlags::ZombieMod) && !is_creature_ &&
                game_state.IsEarlyRound (cv_zp_shelter_time.As<float> ()) &&
                !graph.GetPoints (PointType::Camp).empty ()) {
              return FindRandomNode (PointType::Camp);
            }
          '''
          if "ZP humans first look" not in s:
              s = s.replace(marker, marker + "\n" + zp, 1)
          # ZP goal spreading: avoid destinations already chosen by another live bot.
          # This prevents the whole pack selecting one identical camp/roam node.
          spread_old = "int Bot::FindRandomNode (PointType type) {" + chr(10) + "  int picked = kInvalidNodeIndex;" + chr(10) + chr(10) + "  for (int tries = 0; tries < 8; ++tries) {" + chr(10) + "    const int candidate = (type == PointType::Count) ? graph.Random () : graph.GetRandomPoint (type);" + chr(10) + chr(10) + "    if (!graph.Exists (candidate)) {" + chr(10) + "      continue;" + chr(10) + "    }" + chr(10) + "    picked = candidate;" + chr(10) + chr(10) + "    if (!mode_walls.IsNodeBlocked (graph[candidate].origin)) {" + chr(10) + "      break;" + chr(10) + "    }" + chr(10) + "  }" + chr(10) + "  return picked;" + chr(10) + "}"
          spread_new = "int Bot::FindRandomNode (PointType type) {" + chr(10) + "  int picked = kInvalidNodeIndex;" + chr(10) + chr(10) + "  for (int tries = 0; tries < (game.Is (GameFlags::ZombieMod) ? 24 : 8); ++tries) {" + chr(10) + "    const int candidate = (type == PointType::Count) ? graph.Random () : graph.GetRandomPoint (type);" + chr(10) + chr(10) + "    if (!graph.Exists (candidate)) {" + chr(10) + "      continue;" + chr(10) + "    }" + chr(10) + "    picked = candidate;" + chr(10) + chr(10) + "    if (mode_walls.IsNodeBlocked (graph[candidate].origin)) {" + chr(10) + "      continue;" + chr(10) + "    }" + chr(10) + chr(10) + "    if (game.Is (GameFlags::ZombieMod)) {" + chr(10) + "      bool reserved = false;" + chr(10) + "      for (auto &other : bots) {" + chr(10) + "        if (&other == this || !other.is_alive_) {" + chr(10) + "          continue;" + chr(10) + "        }" + chr(10) + "        const int other_goal = other.Task ()->data;" + chr(10) + "        if (other_goal == candidate || (graph.Exists (other_goal) && graph[other_goal].origin.distance_sq (graph[candidate].origin) < ystl::sqrf (384.0f))) {" + chr(10) + "          reserved = true;" + chr(10) + "          break;" + chr(10) + "        }" + chr(10) + "      }" + chr(10) + "      if (reserved) {" + chr(10) + "        continue;" + chr(10) + "      }" + chr(10) + "    }" + chr(10) + "    break;" + chr(10) + "  }" + chr(10) + "  return picked;" + chr(10) + "}"
          if spread_old not in s:
              raise SystemExit("ZP FindRandomNode anchor not found")
          s = s.replace(spread_old, spread_new, 1)
          nav.write_text(s)

          # Prefer ladders in Zombie Plague by removing the stock 50% ladder penalty.
          planner = Path("yapb/src/planner.cpp")
          s = planner.read_text()
          old = "if (has_flag (graph[current_index].flags, NodeFlag::Crouch | NodeFlag::Ladder)) {"
          new = "if (has_flag (graph[current_index].flags, NodeFlag::Crouch)) {"
          if old not in s:
              raise SystemExit("Planner crouch/ladder condition not found")
          s = s.replace(old, new, 1)
          planner.write_text(s)

          # ZP movement improvements:
          # 1) creatures keep hunting instead of giving up at the last known position;
          # 2) creatures may jump/climb ordinary ledges while attacking;
          # 3) humans prefer camp/shelter points during the opening shelter period.
          tasks = Path("yapb/src/tasks.cpp")
          s = tasks.read_text()
          old = """  else if (UpdateNavigation ()) // reached last enemy pos?
          {
            // forget about it
            CompleteTask ();

            prev_goal_index_ = kInvalidNodeIndex;
            last_enemy_origin_.clear ();
          }"""
          if old not in s:
              old = """  else if (UpdateNavigation ()) // reached last enemy pos?
          {
            // forget about it
            CompleteTask ();

            prev_goal_index_ = kInvalidNodeIndex;
            last_enemy_origin_.clear ();
          }"""
          new = """  else if (UpdateNavigation ()) // reached last enemy pos?
          {
            if (game.Is (GameFlags::ZombieMod) && is_creature_ && game.IsPlayerEntity (last_enemy_) &&
                game.IsAliveEntity (last_enemy_)) {
              // Keep pursuing living humans. Refresh their current position and repath.
              last_enemy_origin_ = game.GetEntityOrigin (last_enemy_);
              prev_goal_index_ = kInvalidNodeIndex;
              Task ()->data = kInvalidNodeIndex;
              path_walk_.Clear ();
            }
            else {
              CompleteTask ();
              prev_goal_index_ = kInvalidNodeIndex;
              last_enemy_origin_.clear ();
            }
          }"""
          if old in s:
              s = s.replace(old, new, 1)
          else:
              # Match current upstream formatting without depending on comments/whitespace.
              start = s.find("  else if (UpdateNavigation ()) // reached last enemy pos?")
              stop = s.find("\n\n  // do we need to calculate a new path?", start)
              if start < 0 or stop < 0:
                  raise SystemExit("TaskHunt navigation section not found")
              s = s[:start] + new + s[stop:]
          tasks.write_text(s)

          nav = Path("yapb/src/navigate.cpp")
          s = nav.read_text()
          needle = "GetTaskId () == TaskId::Attack || GetTaskId () == TaskId::Camp"
          replacement = "((!game.Is (GameFlags::ZombieMod) || !is_creature_) && GetTaskId () == TaskId::Attack) || GetTaskId () == TaskId::Camp"
          if needle in s:
              s = s.replace(needle, replacement, 1)
          else:
              print("Current upstream terrain code differs; skipping attack-guard patch. Pursuit + stock obstacle navigation remain enabled.")
          nav.write_text(s)

          # ZP combat roles:
          # Zombies: no circling/strafing around humans; charge straight at them.
          # Humans: keep normal gun combat so they can fire while moving toward shelter/cover.
          combat = Path("yapb/src/combat.cpp")
          s = combat.read_text()
          marker = "  const auto distance_sq = pev->origin.distance_sq (enemy_->v.origin);"
          inject = """  // ZP creature role: focus entirely on catching the human.
          // Do not orbit/strafe around the target. Run directly toward it.
          if (game.Is (GameFlags::ZombieMod) && is_creature_) {
            dest_origin_ = enemy_->v.origin;
            move_speed_ = pev->maxspeed;
            strafe_speed_ = 0.0f;
            fight_style_ = Fight::Stay;

            // Keep obstacle/jump checks available while charging.
            check_terrain_ = true;
            move_to_goal_ = true;
          }

          const auto distance_sq = pev->origin.distance_sq (enemy_->v.origin);"""
          attack_pos = s.find("void Bot::AttackMovement ()")
          marker_pos = s.find(marker, attack_pos)
          if attack_pos < 0 or marker_pos < 0:
              raise SystemExit("AttackMovement distance statement not found")
          s = s[:marker_pos] + inject + s[marker_pos + len(marker):]

          # The stock creature branch forces combat strafing at close range.
          old = """  if ((UsesKnife () && is_enemy_cone) || is_creature_) {
            if (distance_sq < ystl::sqrf (100.0f)) {
              fight_style_ = Fight::Strafe;
            }
          }"""
          new = """  if ((UsesKnife () && is_enemy_cone) && !is_creature_) {
            if (distance_sq < ystl::sqrf (100.0f)) {
              fight_style_ = Fight::Strafe;
            }
          }
          if (game.Is (GameFlags::ZombieMod) && is_creature_) {
            fight_style_ = Fight::Stay;
            move_speed_ = pev->maxspeed;
            strafe_speed_ = 0.0f;
          }"""
          if old in s:
              s = s.replace(old, new, 1)
          else:
              print("Close-range creature strafe block differs; direct-charge block still applied.")
          # ZP vertical pursuit: if the human is clearly above/below us, do not let
          # close 2D creature combat override graph navigation. This makes infected
          # finish the ladder/tunnel/ramp route instead of spinning under the target.
          react_old = "  if (is_creature_) {" + chr(10) + "    is_enemy_reachable_ = pev->origin.distance_sq2d (enemy_->v.origin) < ystl::sqrf (128.0f);" + chr(10) + chr(10) + "    if (is_enemy_reachable_) {" + chr(10) + "      nav_timer_.start ();" + chr(10) + "    }" + chr(10) + "    return is_enemy_reachable_;" + chr(10) + "  }"
          react_new = "  if (is_creature_) {" + chr(10) + "    const float vertical_gap = ystl::abs (enemy_->v.origin.z - pev->origin.z);" + chr(10) + "    is_enemy_reachable_ = vertical_gap < 48.0f && pev->origin.distance_sq2d (enemy_->v.origin) < ystl::sqrf (128.0f);" + chr(10) + chr(10) + "    if (is_enemy_reachable_) {" + chr(10) + "      nav_timer_.start ();" + chr(10) + "    }" + chr(10) + "    return is_enemy_reachable_;" + chr(10) + "  }"
          if react_old not in s:
              raise SystemExit("ZP creature ReactOnEnemy anchor not found")
          s = s.replace(react_old, react_new, 1)
          combat.write_text(s)

          # ZP anti-pack behavior: do not broadcast one infected target to every
          # creature teammate. Each infected must acquire its own enemy/navigation path.
          share_old = "      // alert teammates watching this bot that have no enemy of their own" + chr(10) + "      for (auto &other : bots) {"
          share_new = "      // alert teammates watching this bot that have no enemy of their own" + chr(10) + "      if (!(game.Is (GameFlags::ZombieMod) && is_creature_)) for (auto &other : bots) {"
          if share_old not in s:
              raise SystemExit("ZP teammate enemy-share anchor not found")
          s = s.replace(share_old, share_new, 1)
          combat.write_text(s)

          # ZP creatures never use flashlight. If one is already on, turn it off.
          vision = Path("yapb/src/vision.cpp")
          vs = vision.read_text()
          dark_anchor = "void Bot::CheckDarkness () {" + chr(10)
          dark_patch = "void Bot::CheckDarkness () {" + chr(10) + "  if (game.Is (GameFlags::ZombieMod) && is_creature_) {" + chr(10) + "    if (pev->effects & EF_DIMLIGHT) {" + chr(10) + "      pev->impulse = 100;" + chr(10) + "    }" + chr(10) + "    return;" + chr(10) + "  }" + chr(10)
          if dark_anchor not in vs:
              raise SystemExit("ZP flashlight anchor not found")
          vs = vs.replace(dark_anchor, dark_patch, 1)
          vision.write_text(vs)

          # Hard block flashlight impulse at the final RunPlayerMove boundary.
          manager = Path("yapb/src/manager.cpp")
          ms = manager.read_text()
          impulse_anchor = "  const auto input_impulse = static_cast<uint8_t> (bot->pev->impulse);"
          impulse_patch = "  const auto input_impulse = static_cast<uint8_t> ((game.Is (GameFlags::ZombieMod) && bot->is_creature_) ? 0 : bot->pev->impulse);"
          if impulse_anchor not in ms:
              raise SystemExit("ZP final impulse anchor not found")
          ms = ms.replace(impulse_anchor, impulse_patch, 1)
          manager.write_text(ms)

          # ZP live role refresh: admin Human/Zombie conversions must invalidate stale combat state immediately.
          behavior = Path("yapb/src/behavior.cpp")
          bs = behavior.read_text()
          role_anchor = "  is_creature_ = IsCreature ();"
          role_patch = "  const bool was_creature = is_creature_;" + chr(10) + "  if (game.Is (GameFlags::ZombieMod)) {" + chr(10) + "    RefreshCreatureStatus (nullptr);" + chr(10) + "  }" + chr(10) + "  is_creature_ = IsCreature ();" + chr(10) + "  if (game.Is (GameFlags::ZombieMod) && was_creature != is_creature_) {" + chr(10) + "    enemy_ = nullptr;" + chr(10) + "    last_enemy_ = nullptr;" + chr(10) + "    enemy_origin_.clear ();" + chr(10) + "    last_enemy_origin_.clear ();" + chr(10) + "    states_ &= ~(Sense::SeeingEnemy | Sense::SuspectEnemy | Sense::HearingEnemy);" + chr(10) + "    prev_goal_index_ = kInvalidNodeIndex;" + chr(10) + "    enemy_reachable_timer_.invalidate ();" + chr(10) + "    see_enemy_timer_.start ();" + chr(10) + "    ClearTasks ();" + chr(10) + "    ClearSearchNodes ();" + chr(10) + "    chosen_goal_index_ = kInvalidNodeIndex;" + chr(10) + "    current_node_index_ = kInvalidNodeIndex;" + chr(10) + "    move_speed_ = pev->maxspeed;" + chr(10) + "    strafe_speed_ = 0.0f;" + chr(10) + "    nav_timer_.start ();" + chr(10) + "    fight_style_ = Fight::Stay;" + chr(10) + "  }"
          if role_anchor not in bs:
              raise SystemExit("ZP live role refresh anchor not found")
          bs = bs.replace(role_anchor, role_patch, 1)
          behavior.write_text(bs)

          # ZP live target validation: never keep shooting a player that changed to our current side.
          combat = Path("yapb/src/combat.cpp")
          cs = combat.read_text()
          lookup_anchor = "  enemy_parts_ = Visibility::None;" + chr(10) + "  enemy_origin_.clear ();"
          lookup_patch = lookup_anchor + chr(10) + chr(10) + "  if (game.Is (GameFlags::ZombieMod) && !game.IsNullEntity (enemy_) && game.IsPlayerEntity (enemy_)) {" + chr(10) + "    if (game.GetRealPlayerTeam (enemy_) == game.GetRealPlayerTeam (Ent ())) {" + chr(10) + "      enemy_ = nullptr;" + chr(10) + "      last_enemy_ = nullptr;" + chr(10) + "      enemy_body_part_set_ = nullptr;" + chr(10) + "      last_enemy_origin_.clear ();" + chr(10) + "      states_ &= ~(Sense::SeeingEnemy | Sense::SuspectEnemy);" + chr(10) + "      wants_to_fire_ = false;" + chr(10) + "      enemy_update_timer_.invalidate ();" + chr(10) + "    }" + chr(10) + "  }"
          if lookup_anchor not in cs:
              raise SystemExit("ZP live target validation anchor not found")
          cs = cs.replace(lookup_anchor, lookup_patch, 1)
          # In ZP use live engine teams for player hostility instead of the cached client team.
          team_filter_old = "      if (!client.IsUsedAndAlive () || client.IsSameTeam (team_)) {" + chr(10) + "        continue;" + chr(10) + "      }" + chr(10) + "      player = client.ent;"
          team_filter_new = "      if (!client.IsUsedAndAlive ()) {" + chr(10) + "        continue;" + chr(10) + "      }" + chr(10) + "      player = client.ent;" + chr(10) + "      if ((game.Is (GameFlags::ZombieMod) && game.GetRealPlayerTeam (player) == game.GetRealPlayerTeam (Ent ())) ||" + chr(10) + "          (!game.Is (GameFlags::ZombieMod) && client.IsSameTeam (team_))) {" + chr(10) + "        continue;" + chr(10) + "      }"
          if team_filter_old not in cs:
              raise SystemExit("ZP live team filter anchor not found")
          cs = cs.replace(team_filter_old, team_filter_new, 1)
          combat.write_text(cs)

          # ZP graph analyzer: probe intermediate platform heights.
          analyze = Path("yapb/src/analyze.cpp")
          s = analyze.read_text()
          anchor = "      { range,  0.0f,   128.0f },"
          probes = [
              "      { range,  0.0f,   48.0f },",
              "      { -range, 0.0f,   48.0f },",
              "      { 0.0f,   range,  48.0f },",
              "      { 0.0f,   -range, 48.0f },",
              "      { range,  0.0f,   72.0f },",
              "      { -range, 0.0f,   72.0f },",
              "      { 0.0f,   range,  72.0f },",
              "      { 0.0f,   -range, 72.0f },",
              "      { range,  0.0f,   96.0f },",
              "      { -range, 0.0f,   96.0f },",
              "      { 0.0f,   range,  96.0f },",
              "      { 0.0f,   -range, 96.0f },",
          ]
          if anchor not in s:
              raise SystemExit("Analyzer vertical probe anchor not found")
          s = s.replace(anchor, chr(10).join(probes) + chr(10) + anchor, 1)
          # Preserve and repair short vertical jump chains after analyzer optimization.
          # Keep the injected C++ as escaped Python strings so YAML remains valid.
          repair_anchor = "void GraphAnalyze::Cleanup () {"
          repair_lines = [
              "void GraphAnalyze::ZpRepairVerticalJumpLinks () {",
              "  constexpr float kMaxHorizontal = 190.0f;",
              "  constexpr float kMaxRise = 128.0f;",
              "  constexpr float kMinRise = 18.0f;",
              "  int added = 0;",
              "  for (int from = 0; from < graph.Length (); ++from) {",
              "    if (!graph.Exists (from) || !HasFreeLinkSlot (from)) continue;",
              "    const auto candidates = graph.GetNearestInRadius (240.0f, graph[from].origin, 24);",
              "    for (const auto &to : candidates) {",
              "      if (!graph.Exists (to) || to == from || graph.IsConnected (from, to) || !HasFreeLinkSlot (from)) continue;",
              "      const auto delta = graph[to].origin - graph[from].origin;",
              "      const float rise = delta.z;",
              "      const float horizontal_sq = delta.x * delta.x + delta.y * delta.y;",
              "      if (rise < kMinRise || rise > kMaxRise || horizontal_sq > kMaxHorizontal * kMaxHorizontal) continue;",
              "      if (!graph.IsNodeReacheableWithJump (graph[from].origin, graph[to].origin)) continue;",
              "      graph.AddPath (from, to, graph[from].origin.distance (graph[to].origin));",
              "      graph.FlagJumpLink (from, to);",
              "      graph[from].radius = 0.0f;",
              "      ++added;",
              "    }",
              "  }",
              '  ctrl.Debug ("[ZP] vertical jump repair added %d validated links.", added);',
              "}",
              "",
          ]
          repair_code = chr(10).join(repair_lines)
          if "ZpRepairVerticalJumpLinks" not in s:
              if repair_anchor not in s:
                  raise SystemExit("Analyzer cleanup anchor not found")
              s = s.replace(repair_anchor, repair_code + repair_anchor, 1)

          call_anchor = '        LogGraphStats ("post-cleanup");'
          call_lines = [
              '        LogGraphStats ("post-cleanup");',
              "        ZpRepairVerticalJumpLinks ();",
              '        LogGraphStats ("post-zp-vertical-repair");',
          ]
          if "post-zp-vertical-repair" not in s:
              if call_anchor not in s:
                  raise SystemExit("Analyzer post-cleanup call anchor not found")
              s = s.replace(call_anchor, chr(10).join(call_lines), 1)
          analyze.write_text(s)

          analyze_h = Path("yapb/inc/analyze.h")
          hs = analyze_h.read_text()
          decl_anchor = "  void Cleanup ();"
          if "ZpRepairVerticalJumpLinks" not in hs:
              if decl_anchor not in hs:
                  raise SystemExit("Analyzer header cleanup declaration not found")
              hs = hs.replace(decl_anchor, decl_anchor + chr(10) + "  void ZpRepairVerticalJumpLinks ();", 1)
          analyze_h.write_text(hs)

      - name: Configure legacy Linux x86 with Zig
        run: |
          cmake --preset ci-linux-x86 -S yapb

      - name: Build
        run: cmake --build yapb/build/ci-linux-x86 --parallel 2

      - name: Verify 32-bit binaries
        run: |
          find yapb/build -type f -name "*.so" -print -exec file {} \;
          YAPB_SO="$(find yapb/build -type f -name 'yapb.so' | head -n1)"
          test -n "$YAPB_SO"
          file "$YAPB_SO" | grep -E "ELF 32-bit.*Intel 80386"
          echo "Required GLIBC versions:"
          readelf --version-info "$YAPB_SO" | grep -o 'GLIBC_[0-9.]*' | sort -Vu || true
          if readelf --version-info "$YAPB_SO" | grep -Eq 'GLIBC_2\.(3[4-9]|[4-9][0-9])'; then
            echo "ERROR: binary requires GLIBC 2.34+"
            exit 1
          fi

      - name: Collect binaries and YaPB 4.8 ZP43 configs
        run: |
          mkdir -p artifact/bin artifact/conf
          YAPB_SO="$(find yapb/build -type f -name 'yapb.so' | head -n1)"
          cp -v "$YAPB_SO" artifact/bin/yapb.so
          cp -v yapb/cfg/addons/yapb/conf/*.cfg artifact/conf/
          cp yapb/LICENSE artifact/ || true

          cat >> artifact/conf/yapb.cfg <<'EOF'

          // ============================================================
          // Zombie Plague 4.3 profile - custom YaPB build
          // ============================================================
          yb_ignore_objectives "1"
          yb_botbuy "0"
          yb_camping_allowed "1"
          yb_ignore_enemies_after_spawn_time "0"

          // Custom cvars compiled into this build.
          yb_zp_shelter_time "18"
          yb_zp_population_schedule "1"
          yb_zp_day_start "8"
          yb_zp_evening_start "18"
          yb_zp_night_start "0"
          yb_zp_day_bots "4"
          yb_zp_evening_bots "8"
          yb_zp_night_bots "4"
          EOF

          cat > artifact/INSTALL_BG.txt <<'EOF'
          YaPB 4.8.x + Zombie Plague 4.3
          
          1. Спри сървъра.
          2. Backup: cstrike/addons/yapb/bin/yapb.so и cstrike/addons/yapb/conf/
          3. Качи bin/yapb.so в cstrike/addons/yapb/bin/yapb.so
          4. Качи всички файлове от conf/ в cstrike/addons/yapb/conf/ и ги замени.
          5. Не трий addons/yapb/data/graph, learned и train.
          6. Стартирай сървъра и изпълни meta list.
          
          Конфигурациите са актуалният формат YaPB 4.8 и премахват старите
          4.3 config warnings и obsolete команди.
          EOF

      - name: Upload Linux x86 artifact
        uses: actions/upload-artifact@v4
        with:
          name: YaPB-ZP43-Linux-x86-Legacy
          path: artifact/
          if-no-files-found: error
